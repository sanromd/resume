variants:
  international:
    doc_title: "Résumé"
    include_photo: false
    summary: >
      **Applied physicist with a decade of experience converting fundamental optical physics into
      deployed industrial technology.** Co-leads Saudi Aramco's high-power laser programme, carried
      from first-principles modelling of laser–rock interaction through to the petroleum industry's
      **first industrial laser perforation and flowline-descaling field deployments**. Holds a patent
      portfolio of **26 granted inventions across eight jurisdictions** (11 pending), with sole or lead
      inventorship on ten, spanning laser downhole tools, hollow-core optical fibre, photonic/ML
      sensing, and hydrogen-sulfide-to-hydrogen valorisation.
    footnote: "Résumé (International) · Full publication and patent record available in the accompanying Extended CV."

  saudi_residency:
    doc_title: "Curriculum Vitae — prepared for the Saudi Premium Residency Application"
    include_photo: true
    summary: >
      **Applied physicist and technical lead on Saudi Aramco's high-power laser programme**, resident
      in the Kingdom continuously since 2009 (KAUST, then Saudi Aramco's Upstream Advanced Research
      Center). Co-led the physics, modelling and field-execution work that carried laser perforation and
      descaling from laboratory concept to the petroleum industry's **first industrial deployments** —
      homegrown technology protected by **26 granted patents across eight jurisdictions** (11 pending).
      Brings international collaborations (University of Southampton hollow-core fibre; KAUST
      photocatalysis) into industrial application inside Saudi Arabia, and opened research lines in
      hydrogen-sulfide valorisation and photonic/ML sensing aligned with the Kingdom's
      energy-diversification objectives.
    footnote: "Curriculum Vitae — prepared for the Saudi Premium Residency Application · Full publication and patent record available in the accompanying Extended CV."

# -----------------------------------------------------------------------
# Career arc — used verbatim in the Extended CV; condensed narrative also
# informs the two-page résumés via `career_headline` on each experience entry.
# -----------------------------------------------------------------------
career_arc:
  - phase: "Phase I — Theoretical & computational photonics (KAUST, 2009–2014)"
    text: >
      Founding cohort member of the KAUST Photonics Master's programme; M.S. (2010) and PhD (2014) in
      Electrical Engineering under Prof. Boon S. Ooi. Work centred on light propagation in
      heterogeneous, nonlinear and time-varying media — computational electromagnetics, beam shaping
      and chalcogenide-glass material engineering. Thesis: *Exploring Heterogeneous and Time-Varying
      Materials for Photonic Applications, Towards Solutions for the Manipulation and Confinement of
      Light* (KAUST, 2014).
  - phase: "Phase II — Applied laser–matter interaction (Saudi Aramco, 2015–2019)"
    text: >
      Transition from theory to industrial application: numerical modelling of laser–rock and
      electromagnetic–rock interaction, thermal/geomechanical coupling, and the early laser-perforation
      programme. First-author work established the physics models underpinning the technology.
  - phase: "Phase III — Technology deployment & diversification (2020–present)"
    text: >
      Co-PI on Aramco's high-power laser programme with Sameeh I. Batarseh, carrying the technology
      from laboratory demonstration to first industrial field deployment. In parallel, opened three new
      research lines: hydrogen-sulfide valorisation and solar fuels; photonic and machine-learning
      sensing for subsurface and surface assets; and hollow-core optical fibre for kilowatt-class
      downhole power delivery.

# -----------------------------------------------------------------------
# Achievement clusters — full prose for the Extended CV. The résumé
# templates use the first cluster's `resume_callout` + `resume_bullets`
# for the "Applied Physicist" experience entry.
# -----------------------------------------------------------------------
achievement_clusters:
  - title: "High-power laser technology: laboratory to first industrial deployment"
    intro: "The defining programme of the career, documented continuously in the peer-reviewed and industry record over a decade:"
    resume_callout: >
      Co-led the physics, modelling and field-execution programme that took high-power laser
      perforation and descaling from laboratory concept to the petroleum industry's **first industrial
      deployments** (2021–2024), documented across 25+ peer-reviewed and conference publications and a
      supporting patent portfolio.
    bullets:
      - "**Physics & modelling foundation (2016–2019)** — first-authored the governing numerical treatments of laser–rock interaction (ARMA-2016-142), thermal/geomechanical dynamics of electromagnetic heating (SPE-183917-MS, SPE-188790-MS), and a scalable numerical solution for subsurface wave propagation (SPE-194888-MS, sole author). The coupled thermal–mechanical model was published in *SPE Journal* (2019)."
      - "**Technology maturation (2019–2022)** — laser perforation as a completion technology (SPE-197192-MS), performance in carbonates and organic-rich shales (SPE-197480-MS; SPE-204809-MS, first author), laser drilling in extremely hard formations (OTC-30416-MS), and laser cladding for corrosion prevention (SPE-201617-MS)."
      - "**First field deployments (2021–2024)** — first industrial flowline-descaling deployment (Dec. 2021; SPE-209972-MS), underlying principles first-authored (SPE-209977-MS); first industrial high-power laser perforation deployment (SPE-215016-MS, 2023) and its field validation (SPE-220900-MS, 2024)."
      - "**Extension & scale-up (2023–2025)** — laser drilling milestones (SPE-215166-MS), photonic–hydraulic hybrid fracturing lowering breaking pressure (SPE-216510-MS, SPE-215162-MS), a long-range descaling robot (SPE-222608-MS), sweet-spot creation in tight/unconventional reservoirs (SPE-227837-MS, 2025), and net-zero reframing of the programme (SPE-224865-MS, 2025)."
    resume_bullets:
      - "**Physics & modelling foundation (2016–2019):** first-authored the governing numerical treatments of laser–rock interaction and the thermal/geomechanical dynamics of electromagnetic heating; the coupled thermal–mechanical model was published in *SPE Journal* (2019)."
      - "**First-of-kind field deployments (2021–2024):** delivered the industry's first industrial flowline-descaling field trial (Dec. 2021) and first industrial high-power laser perforation deployment (2023), each with a companion field-validation study."
      - "**Diversification (2020–present):** opened three new research lines — hydrogen-sulfide valorisation to hydrogen, photonic/ML sensing for subsurface and surface assets, and hollow-core optical fibre for kilowatt-class downhole power delivery, developed with the University of Southampton Optoelectronics Research Centre."
      - "Recognised by Saudi Aramco Senior Vice President Waleed A. Al-Mulhim, with the Laser Research Team, for the first laser-perforation field trial (*The Arabian Sun / Aramco Life*, 2023)."

  - title: "Hollow-core optical fibre for kilowatt-class power delivery"
    intro: ""
    text: >
      Co-inventor with the University of Southampton Optoelectronics Research Centre
      (Poletti/Richardson group) on nested anti-resonant nodeless fibre (NANF) and corrugated-cladding
      fibre enabling multi-kilowatt continuous-wave transmission at 1050–1100 nm over the distances
      required for downhole delivery — the enabling physical layer for the laser programme above
      (US 11,555,958 B2 + EP 4,067,952 B1; US 11,585,976 B2 + EP 4,067,735 A1 + SA 122,430,881 B1).

  - title: "Hydrogen sulfide valorisation and solar fuels"
    intro: ""
    text: >
      A sustainability research line combining peer-reviewed publication with a protected IP position —
      converting a waste stream into hydrogen rather than elemental sulfur: senior-author perspective in
      *Advanced Energy and Sustainability Research* (2023, with the KAUST Laquai group); UV-induced
      decomposition pathways in *RSC Advances* (2025, up to 52% conversion within 60 minutes); and a
      patent cluster spanning photocatalytic conversion (US 12,559,366 B2, lead inventor), dissociation
      via reactive sulfur species (US 12,459,816 B2), photolytic conversion in produced-gas streams
      (US 2024/0060411 A1), and steam-methane reforming (US 2025/0368507 A1).

  - title: "Photonic and machine-learning sensing"
    intro: ""
    text: >
      A coherent programme applying optics, spectroscopy and machine learning to characterisation and
      monitoring: subsurface property inference from early ML applications (SPE-195118-MS, 2019, first
      author) to hyperspectral multiphysics inference (SPIE, 2023, first author), protected in
      US 12,682,216 B2 (sole inventor) and US 12,487,075 B2; asset monitoring and computer vision
      (IPTC-23632-MS; US 12,430,795 B2; US 11,725,504 B2, five-jurisdiction family; the 2026
      wellhead-displacement trio using beam deflection, speckle reflectometry and shadowgraphy);
      emissions/sustainability (US 12,394,183 B2); and chemical/fibre sensing (US 11,867,629 B2;
      US 12,253,459 B2; US 12,359,554 B2; US 2024/0141777 A1).

  - title: "Theoretical physics and computational electromagnetics"
    intro: ""
    text: >
      The scientific foundation of the career: optical analogues of gravitational attractors
      (*Optics Express*, 2013, first author — the most-cited work, featured in *Laser Focus World*,
      July 2013); Bessel–Gauss beam shaping from heterogeneous refractive-index maps (*JOSA A*, 2012,
      first author); electron-irradiation-induced permittivity reduction in chalcogenide glass
      (*J. Appl. Phys.*, 2013, first author); a high-order finite-volume method for Maxwell's equations
      in time-varying media (arXiv:2307.11842, first author, with D. I. Ketcheson, 2023); and a
      revisitation of the quantum beam splitter without a vacuum state (*Rev. Mex. Fís. E*, 2022).

